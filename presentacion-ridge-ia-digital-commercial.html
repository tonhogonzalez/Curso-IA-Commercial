<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIDGE // Iniciativas de IA en Procesos Digitales · Banca Comercial</title>
  <style>
    /* ==========================================================================
       RIDGE ENGINE · SCROLL-DRIVEN 3D TOPOGRAPHIC PRESENTATION (ZERO-CDN)
       ========================================================================== */
    :root {
      --bg-deep: #04060b;
      --glass-bg: rgba(8, 12, 22, 0.72);
      --glass-border: rgba(255, 255, 255, 0.13);
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --accent: #f59e0b;
      --accent-2: #38bdf8;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Outfit', 'Space Grotesk', 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: auto; background: var(--bg-deep); color: var(--text-main); font-family: var(--font-sans); }
    body { overflow-x: hidden; background: var(--bg-deep); selection-background-color: var(--accent); }

    /* Contenedor de Scroll Largo (620vh) que alimenta la cámara 3D */
    .ridge-scroll-track {
      height: 620vh;
      position: relative;
    }

    /* Escenario Fijo (Single Sticky Stage) */
    .ridge-sticky-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      perspective: 1400px;
    }

    /* Lienzo 3D Topográfico (Ridge Lines + Horizonte Atmosférico + Nodos de Cumbre) */
    #ridge-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Viñeta Cinematográfica y Grano Sutil */
    .ridge-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 42%, transparent 35%, rgba(3, 5, 10, 0.78) 100%),
        linear-gradient(180deg, rgba(3, 5, 10, 0.75) 0%, transparent 18%, transparent 78%, rgba(3, 5, 10, 0.92) 100%);
    }

    /* ==========================================================================
       HUD SUPERIOR DE TELEMETRÍA Y NAVEGACIÓN DE CUMBRES
       ========================================================================== */
    .ridge-hud-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.8rem;
      background: linear-gradient(180deg, rgba(4, 6, 11, 0.9) 0%, rgba(4, 6, 11, 0) 100%);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }
    .ridge-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #fff;
      font-weight: 800;
    }
    .ridge-brand-mark {
      width: 28px; height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #04060b;
      font-weight: 900;
      font-size: 0.78rem;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.45);
    }
    .ridge-telemetry {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }
    .ridge-telemetry strong { color: #f8fafc; }
    @media (max-width: 900px) { .ridge-telemetry { display: none; } }

    .ridge-top-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .ridge-btn {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.42rem 0.8rem;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(12, 17, 30, 0.75);
      color: #e2e8f0;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 180ms cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
    }
    .ridge-btn:hover {
      border-color: var(--accent);
      color: #fff;
      transform: translateY(-1px);
    }
    .ridge-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #04060b;
    }

    /* ==========================================================================
       ESCENARIO CENTRAL DE DIAPOSITIVAS 2.5D (TRANSICIÓN EN EJE Z)
       ========================================================================== */
    .ridge-stage-grid {
      position: absolute;
      inset: 68px 0 84px 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(320px, 560px) minmax(320px, 560px);
      justify-content: space-between;
      align-items: center;
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 2.2rem;
      gap: 2rem;
      pointer-events: none;
    }
    @media (max-width: 1024px) {
      .ridge-stage-grid {
        grid-template-columns: 1fr;
        overflow-y: auto;
        padding: 1rem 1.2rem;
        align-content: center;
      }
    }

    .ridge-glass-panel {
      pointer-events: auto;
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(175%);
      -webkit-backdrop-filter: blur(24px) saturate(175%);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.85rem 2rem;
      box-shadow:
        0 30px 70px -15px rgba(0, 0, 0, 0.78),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: border-color 300ms ease, transform 140ms ease-out;
    }
    .ridge-glass-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, 0.09), transparent 60%);
    }

    .ridge-chapter-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.26rem 0.7rem;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fcd34d;
      margin-bottom: 0.9rem;
    }
    .ridge-chapter-pill .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .ridge-title {
      font-family: var(--font-display);
      font-size: clamp(1.55rem, 2.3vw, 2.25rem);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.025em;
      margin-bottom: 0.85rem;
      color: #ffffff;
    }
    .ridge-word {
      display: inline-block;
      transition: transform 460ms cubic-bezier(0.16, 1, 0.3, 1), opacity 460ms ease, filter 460ms ease;
    }

    .ridge-subtitle {
      font-size: 0.92rem;
      line-height: 1.62;
      color: #cbd5e1;
      margin-bottom: 1.25rem;
    }

    /* Lista de Iniciativas / Pilares dentro del panel izquierdo */
    .ridge-points {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-bottom: 1.15rem;
    }
    .ridge-point {
      display: grid;
      grid-template-columns: 44px 1fr;
      align-items: start;
      gap: 0.7rem;
      padding: 0.65rem 0.8rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 200ms ease;
    }
    .ridge-point:hover {
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.065);
      transform: translateX(3px);
    }
    .ridge-point-code {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 800;
      text-align: center;
      padding: 0.22rem 0.35rem;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.38);
      color: #7dd3fc;
    }
    .ridge-point strong {
      display: block;
      font-size: 0.84rem;
      color: #f8fafc;
      margin-bottom: 0.12rem;
    }
    .ridge-point span {
      display: block;
      font-size: 0.76rem;
      line-height: 1.45;
      color: #94a3b8;
    }

    /* Pie del panel con KPI de Impacto */
    .ridge-impact-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding-top: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-family: var(--font-mono);
      font-size: 0.74rem;
    }
    .ridge-impact-strip .tag {
      color: #6ee7b7;
      font-weight: 800;
    }

    /* ==========================================================================
       PANEL DERECHO: ARQUITECTURA INTERACTIVA Y SIMULADOR DE PROCESOS DIGITALES
       ========================================================================== */
    .ridge-blueprint-card {
      pointer-events: auto;
      background: rgba(6, 10, 19, 0.78);
      backdrop-filter: blur(22px) saturate(165%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 1.4rem 1.55rem;
      box-shadow: 0 28px 65px -12px rgba(0, 0, 0, 0.8);
    }
    .bp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 0.75rem;
      margin-bottom: 0.9rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: #94a3b8;
    }
    .bp-mode-switch {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 2px;
    }
    .bp-mode-btn {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
    }
    .bp-mode-btn.active {
      background: var(--accent);
      color: #04060b;
    }

    /* Diagrama de Nodos del Proceso Digital */
    .bp-flow-steps {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-bottom: 1rem;
    }
    .bp-step-node {
      position: relative;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 11px;
      padding: 0.65rem 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      transition: all 240ms ease;
    }
    .bp-step-node.ai-active {
      border-color: rgba(16, 185, 129, 0.48);
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.13) 0%, rgba(6, 182, 212, 0.05) 100%);
    }
    .bp-step-node.legacy-active {
      border-color: rgba(244, 63, 94, 0.42);
      background: rgba(244, 63, 94, 0.08);
    }
    .bp-step-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .bp-step-idx {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 800;
      width: 24px; height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      flex-shrink: 0;
    }
    .bp-step-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .bp-step-sub {
      font-size: 0.71rem;
      color: #94a3b8;
    }
    .bp-step-sla {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      white-space: nowrap;
    }
    .bp-step-node.ai-active .bp-step-sla {
      color: #6ee7b7;
      background: rgba(16, 185, 129, 0.16);
    }
    .bp-step-node.legacy-active .bp-step-sla {
      color: #fda4af;
      background: rgba(244, 63, 94, 0.16);
    }

    /* Métricas Comparativas Antes vs IA */
    .bp-kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.55rem;
    }
    .bp-kpi-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 0.55rem 0.65rem;
      text-align: center;
    }
    .bp-kpi-box small {
      display: block;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 0.2rem;
    }
    .bp-kpi-box strong {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    /* ==========================================================================
       BARRA INFERIOR DE NAVEGACIÓN TOPOGRÁFICA (ALTITUDE TIMELINE)
       ========================================================================== */
    .ridge-bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      background: rgba(4, 6, 12, 0.92);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.65rem 1.8rem 0.75rem;
    }
    .ridge-chapters-nav {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.45rem;
      max-width: 1320px;
      margin: 0 auto;
    }
    @media (max-width: 860px) {
      .ridge-chapters-nav {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    .ridge-chap-btn {
      text-align: left;
      padding: 0.42rem 0.65rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      cursor: pointer;
      transition: all 180ms ease;
    }
    .ridge-chap-btn:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
    }
    .ridge-chap-btn.active {
      background: rgba(245, 158, 11, 0.16);
      border-color: var(--accent);
      color: #fff;
    }
    .ridge-chap-btn small {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.58rem;
      color: #fcd34d;
      margin-bottom: 0.12rem;
    }
    .ridge-chap-btn span {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ridge-scroll-meter {
      max-width: 1320px;
      margin: 0.45rem auto 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }
    .ridge-scroll-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #38bdf8, #10b981);
    }
  </style>
</head>

  <!-- Pista de Scroll de 620vh para Scrollytelling Continuo -->
  <div class="ridge-scroll-track" id="scroll-track"></div>

  <!-- Escenario Fijo 3D -->
  <div class="ridge-sticky-stage">

    <!-- Rejilla Central: Narrativa Ejecutiva (Izquierda) + Blueprint Interactivo (Derecha) -->
    <main class="ridge-stage-grid">

      <section class="ridge-glass-panel" id="panel-left">

        <div class="bp-flow-steps" id="bp-steps"></div>

    <!-- Barra Inferior de Cumbres -->
    <footer class="ridge-bottom-bar">
      <div class="ridge-chapters-nav" id="chapters-nav"></div>
      <div class="ridge-scroll-meter"><div class="ridge-scroll-fill" id="scroll-fill"></div></div>

    function syncScrollToChapter(idx) {

      window.scrollTo({ top: targetY, behavior: 'smooth' });

    function renderChapterDOM(idx) {
      const ch = CHAPTERS[idx];
      document.documentElement.style.setProperty('--accent', ch.palette.hex);

      $('#ch-kicker').textContent = ch.kicker;

      const titleEl = $('#ch-title');
      titleEl.innerHTML = ch.title.split(' ').map((w, i) =>
        `<span class="ridge-word" style="opacity:0;filter:blur(9px);transform:translateY(9px);transition-delay:${i * 28}ms">${w}&nbsp;</span>`
      ).join('');
      requestAnimationFrame(() => {
        titleEl.querySelectorAll('.ridge-word').forEach(el => {
          el.style.opacity = '1';
          el.style.filter = 'blur(0px)';
          el.style.transform = 'translateY(0px)';

      $('#ch-lead').textContent = ch.lead;
      $('#ch-impact-val').textContent = ch.impact;

      renderBlueprintDOM(ch);
      renderBottomNav(idx);

    function renderBlueprintDOM(ch) {

    // =========================================================================
    // 3. MOTOR 3D TOPOGRÁFICO «RIDGE» (CURVAS DE NIVEL EN PERSPECTIVA A 60 FPS)
    // =========================================================================
    const canvas = $('#ridge-canvas');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // Función de elevación topográfica multi-octava (crea la cordillera central y los valles laterales)
    function ridgeHeight(xNorm, zWorld, p) {
      // Cordillera desplazada ligeramente a la derecha para dejar aire limpio al texto izquierdo
      const ridgeCenter = 0.12 + Math.sin(zWorld * 0.0022 + p * 0.9) * 0.18;
      const distFromSpine = Math.abs(xNorm - ridgeCenter);
      const envelope = Math.exp(-distFromSpine * distFromSpine * 3.8);

      const h1 = Math.sin(xNorm * 4.5 + zWorld * 0.008) * Math.cos(zWorld * 0.0055 - p * 1.4);
      const h2 = Math.sin(xNorm * 9.2 - zWorld * 0.013 + p * 2.1) * 0.45;
      const h3 = Math.cos((xNorm + zWorld * 0.004) * 16.0) * 0.18;

      // Efecto interactivo de elevación bajo el puntero del ratón
      const mdx = xNorm - (mouse.x * 2 - 1);
      const mouseBoost = Math.exp(-mdx * mdx * 8) * (0.5 - mouse.y) * 55;

      return (envelope * 155 + (h1 + h2 + h3) * 42) + mouseBoost;
    }

    function lerp(a, b, t) { return a + (b - a) * t; }

    function drawRidgeTerrain(now) {
      const t = now * 0.001;

      // Progreso de scroll normalizado
      const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      if (autoPlay) {
        const nextY = (window.scrollY + 1.8) % maxScroll;
        window.scrollTo(0, nextY);
      }
      const rawFrac = Math.max(0, Math.min(1, window.scrollY / maxScroll));
      targetProgress = rawFrac * (CHAPTERS.length - 1);
      currentProgress += (targetProgress - currentProgress) * 0.075;

      // Cambio de capítulo activo cuando cruzamos el umbral
      const nearestChap = Math.round(currentProgress);
      if (nearestChap !== activeChapter) {
        activeChapter = nearestChap;
        renderChapterDOM(activeChapter);
      }

      // Interpolación de color entre la cumbre actual y la siguiente
      const idxA = Math.max(0, Math.min(CHAPTERS.length - 1, Math.floor(currentProgress)));
      const idxB = Math.max(0, Math.min(CHAPTERS.length - 1, idxA + 1));
      const frac = currentProgress - idxA;
      const colA = CHAPTERS[idxA].palette.ridge, colB = CHAPTERS[idxB].palette.ridge;
      const glwA = CHAPTERS[idxA].palette.glow, glwB = CHAPTERS[idxB].palette.glow;
      const rCol = [
        Math.round(lerp(colA[0], colB[0], frac)),
        Math.round(lerp(colA[1], colB[1], frac)),
        Math.round(lerp(colA[2], colB[2], frac))
      ];
      const gCol = [
        Math.round(lerp(glwA[0], glwB[0], frac)),
        Math.round(lerp(glwA[1], glwB[1], frac)),
        Math.round(lerp(glwA[2], glwB[2], frac))
      ];

      // Actualización de telemetría en vivo
      const interpAlt = Math.round(lerp(CHAPTERS[idxA].alt, CHAPTERS[idxB].alt, frac));
      $('#hud-peak').textContent = `0${activeChapter + 1} / 0${CHAPTERS.length}`;
      $('#hud-alt').textContent = interpAlt.toLocaleString('es-ES') + ' m';
      $('#hud-slope').textContent = CHAPTERS[activeChapter].slope;
      $('#hud-pct').textContent = Math.round(rawFrac * 100).toString().padStart(2, '0') + '%';
      $('#scroll-fill').style.width = (rawFrac * 100).toFixed(1) + '%';

      // Fondo y resplandor atmosférico en el horizonte
      ctx.fillStyle = '#04060b';
      ctx.fillRect(0, 0, W, H);

      const horizonY = H * 0.36 + (mouse.y - 0.5) * 28;
      const horizonX = W * 0.56 + (mouse.x - 0.5) * 45;
      const radGlow = ctx.createRadialGradient(horizonX, horizonY, 20, horizonX, horizonY, Math.max(W, H) * 0.65);
      radGlow.addColorStop(0, `rgba(${rCol[0]}, ${rCol[1]}, ${rCol[2]}, 0.24)`);
      radGlow.addColorStop(0.45, `rgba(${gCol[0]}, ${gCol[1]}, ${gCol[2]}, 0.10)`);
      radGlow.addColorStop(1, 'rgba(4, 6, 11, 0)');
      ctx.fillStyle = radGlow;
      ctx.fillRect(0, 0, W, H);

      // Retícula de coordenadas celestes sutil en el cielo
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let gx = 0; gx < W; gx += 120) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, horizonY); ctx.stroke();
      }

      // =======================================================================
      // RENDERIZADO DE LAS 48 CURVAS DE NIVEL 3D (RIDGE CONTOUR LINES)
      // =======================================================================
      const NUM_RIDGES = 48;
      const X_SAMPLES = 72;
      const speedZ = currentProgress * 420 + t * 38;
      const fov = 420;
      const cameraY = 155;
      const bankAngle = (mouse.x - 0.5) * 0.06; // alabeo suave de cámara al mover ratón
      const cosB = Math.cos(bankAngle), sinB = Math.sin(bankAngle);

      // Dibujamos de atrás (horizonte lejano) hacia delante (primer plano) con ocultación de líneas traseras (Painter's algorithm)
      for (let r = NUM_RIDGES - 1; r >= 0; r--) {
        const zDepth = 70 + r * 26 - (speedZ % 26);
        const zWorld = speedZ + zDepth;
        const depthNorm = 1 - r / NUM_RIDGES; // 0 lejos, 1 cerca
        const scale = fov / (fov + zDepth);

        ctx.beginPath();
        const pts = [];
        for (let i = 0; i <= X_SAMPLES; i++) {
          const xNorm = (i / X_SAMPLES) * 2.5 - 1.25; // -1.25 .. +1.25
          const worldX = xNorm * W * 0.95;
          const elev = ridgeHeight(xNorm, zWorld, currentProgress);
          const worldY = cameraY - elev;

          // Rotación de alabeo (banking) y proyección en perspectiva
          const rx = worldX * cosB - worldY * sinB;
          const ry = worldX * sinB + worldY * cosB;

          const px = horizonX + rx * scale;
          const py = horizonY + ry * scale;
          pts.push([px, py, elev]);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }

        // Polígono oscuro inferior para tapar las líneas de detrás (oclusión topográfica real)
        ctx.lineTo(pts[pts.length - 1][0], H + 40);
        ctx.lineTo(pts[0][0], H + 40);
        ctx.closePath();
        ctx.fillStyle = 'rgba(4, 6, 11, 0.92)';
        ctx.fill();

        // Trazo luminoso de la cresta
        ctx.beginPath();
        pts.forEach(([px, py], i) => i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py));
        const isMajorContour = (Math.floor(zWorld / 26) % 5 === 0);
        const alpha = (0.12 + depthNorm * 0.68) * (isMajorContour ? 1.15 : 0.72);
        ctx.strokeStyle = isMajorContour
          ? `rgba(${rCol[0]}, ${rCol[1]}, ${rCol[2]}, ${Math.min(0.95, alpha).toFixed(3)})`
          : `rgba(${gCol[0]}, ${gCol[1]}, ${gCol[2]}, ${Math.min(0.75, alpha * 0.75).toFixed(3)})`;
        ctx.lineWidth = isMajorContour ? 1.9 : 1.05;
        ctx.stroke();

        // Balizas de telemetría en las crestas principales
        if (isMajorContour && r % 6 === 0) {
          const peakPt = pts.reduce((best, cur) => cur[2] > best[2] ? cur : best, pts[0]);
          if (peakPt[0] > W * 0.35 && peakPt[0] < W * 0.92 && peakPt[1] > 80 && peakPt[1] < H - 90) {
            ctx.fillStyle = `rgb(${rCol[0]}, ${rCol[1]}, ${rCol[2]})`;
            ctx.beginPath();
            ctx.arc(peakPt[0], peakPt[1], 3.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = `rgba(${rCol[0]}, ${rCol[1]}, ${rCol[2]}, 0.45)`;
            ctx.beginPath();
            ctx.moveTo(peakPt[0], peakPt[1]);
            ctx.lineTo(peakPt[0], peakPt[1] - 22);
            ctx.stroke();

            ctx.font = '600 9.5px "JetBrains Mono", monospace';
            ctx.fillStyle = 'rgba(248, 250, 252, 0.78)';
            ctx.fillText(`▲ ${Math.round(1100 + peakPt[2] * 8)}m`, peakPt[0] + 5, peakPt[1] - 14);
          }
        }
      }

      requestAnimationFrame(drawRidgeTerrain);
    }

    // Inicializar primera cumbre y arrancar motor 60 FPS
    renderChapterDOM(0);
    requestAnimationFrame(drawRidgeTerrain);
  })();
  </script>
</body>
